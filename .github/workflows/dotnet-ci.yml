name: .NET CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  PROJECT_FILE: TMDT1_TH/TMDT1_TH.csproj
  EF_TOOLS_VERSION: 8.0.29

jobs:
  build:
    name: Restore, build and verify migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Show .NET information
        run: dotnet --info

      - name: Restore NuGet packages
        run: dotnet restore "$PROJECT_FILE"

      - name: Build Release
        run: >
          dotnet build "$PROJECT_FILE"
          --configuration Release
          --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: Install matching EF Core tools
        run: >
          dotnet tool install
          --tool-path ./.dotnet-tools
          dotnet-ef
          --version "$EF_TOOLS_VERSION"

      - name: Verify EF model is represented by migrations
        run: >
          ./.dotnet-tools/dotnet-ef migrations has-pending-model-changes
          --project "$PROJECT_FILE"
          --startup-project "$PROJECT_FILE"
          --configuration Release
          --no-build

      - name: Generate idempotent migration SQL
        run: |
          mkdir -p artifacts
          ./.dotnet-tools/dotnet-ef migrations script             --idempotent             --output artifacts/migrations.sql             --project "$PROJECT_FILE"             --startup-project "$PROJECT_FILE"             --configuration Release             --no-build
          test -s artifacts/migrations.sql
